<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        window.addEventListener("DOMContentLoaded", function () {
          const script = document.createElement("script");
          script.src = "https://cai.c1m.ai/embed.js";
          script.onload = function () {
            if (window.Chatbot) {
              window.Chatbot.init({
                apiUrl: "https://cai.c1m.ai/financeforfounder",
                position: "right",
                welcomeMessage: "Hey there! How can I help you today?",
                bgColor: "white", // Example custom colors
                fontFamily: "Arial, sans-serif",
                fontSize: "14px",
                textColor: "#ffffff",
              });
            } else {
              console.error("Chatbot object not found after script loaded.");
            }
          };
          script.onerror = function () {
            console.error("Failed to load chatbot script.");
          };
          document.head.appendChild(script);
        });
      </script>
      
</head>
<body>
    <p>Hello World!</p>
</body>
</html>
