      <script>
        window.addEventListener("DOMContentLoaded", function () {
          const script = document.createElement("script");
          script.src = "https://cai.c1m.ai/embed.js";
          script.onload = function () {
            if (window.Chatbot) {
              window.Chatbot.init({
                apiUrl: "https://cai.c1m.ai/financeforfounder",
                welcomeMessage: "Hey there! How can I help you today?",
                position: "right",
                sidePadding: "20px",
                bottom: "30px",
                width: "900px",
                height: "600px",
                fontSize: "46px",
                fontColor: "#ffe4c4",
                bgColor: "#0f172a",
                bubbleColor: "#2563eb",
                botColor: "#7c3aed",
              });
            }
          };
          document.head.appendChild(script);
        });
      </script>
      
      
    </head>
