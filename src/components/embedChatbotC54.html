<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        const script = document.createElement("script");
        script.src = "https://cai.c1m.ai/embed.js";
        script.onload = function () {
          if (window.Chatbot) {
            window.Chatbot.init({
              apiUrl: "https://cai.c1m.ai/popup/Chat-C1M-C54",
              welcomeMessage: "Hey there! How can I help you today?",
              position: "right",
              sidePadding: "30px",
              bottom: "0px",
              width: "700px",
              height: "600px",
              fontSize: "24px",
              fontColor: "red", // body font color
              bgColor: "red", // header background Gradient here 
              bgColor1: "purple", // body background
              bubbleColor: "black", // user message bg color
              userMessageFontColor: "green", // user message font color
              botColor: "black", // chatbot response bg color
              chatbotResponseFontColor: "green", // chatbot response font color
              inputBgColor: "green", // input field background color
              inputTextColor: "orange", // input field text color
              inputBorderColor: "black", // input field border color
              submitTextColor: "#ffffff", // submit button text color
              submitBgColor: "#4338ca", // submit button background color
              messageBorderColor: "#C084FC", // message border color
              bgColorFooter: "#C084FC", // bg footer color
              bgColorPoweredByIcon: "red", //  bgColorPoweredByIcon
              fontColorDate: "black", // date color
              fontColorHeader: "black", // header font color
              fontColorPoweredBy: "red", // font color PoweredBy
              bgColorMessage: "black", // bg color of greeting message
              fontColorMessage: "white", // font color of greeting message
              inputPlaceHolderColor: "red", // input placeholder color
              loaderColor: "red", // loader color
            });
          }
        };
        document.head.appendChild(script);
      });
    </script>
  </head>
  <body style="background-color: transparent; margin: 0; padding: 0">
    <p>Hello World!</p>
  </body>
</html>
