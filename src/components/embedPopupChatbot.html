<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        const script = document.createElement("script");
        script.src = "https://cai.c1m.ai/embed.js";
        script.onload = function () {
          if (window.Chatbot) {
            window.Chatbot.init({
              apiUrl: "https://cai.c1m.ai/popup/financeforfounder",
              welcomeMessage: "Hey there! How can I help you today?",
              position: "right",
              sidePadding: "20px",
              bottom: "0px",
              width: "550px",
              height: "560px",
              fontSize: "24px",
              fontColor: "white",
              bgColor: "#4338ca", // header, footer color
              bgColor1: "#35225d", // gradient here
              bubbleColor: "#4338ca", // user message
              botColor: "#6b21a8", // chatbot response
              inputBgColor: "#4f46e5", // input field background color
              inputTextColor: "#ffffff", // input field text color
              inputBorderColor: "#4f46e5", // input field border color
              submitTextColor: "#ffffff", // submit button text color
            });
          }
        };
        document.head.appendChild(script);
      });
    </script>
  </head>
  <body style="background-color: transparent;">
    <p>Hello World!</p>
  </body>
</html>
